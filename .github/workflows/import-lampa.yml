name: Import Lampa source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive
        run: |
          unzip -q lampa-source-main.zip -d /tmp/lampa
          cp -a /tmp/lampa/lampa-source-main/. .
          rm -f lampa-source-main.zip
          rm -f .github/workflows/import-lampa.yml
      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import official Lampa source' || exit 0
          git push origin HEAD:main
